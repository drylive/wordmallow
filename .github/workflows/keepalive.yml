        run: |
          curl -fsS -X POST "https://jfyelzahdqhsfmsmvxkz.supabase.co/rest/v1/rpc/keep_alive" \
            -H "apikey: sb_publishable_4WReAF76bEISxwE9pq0bWQ_pz4miFJ7" \
            -H "Content-Type: application/json" -d '{}'

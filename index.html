const KEY="starPetIsland.v1";
function fresh(){return {v:1,noEgg:true,started:false,pets:[],active:0,energy:0,words:{},challenges:{},items:[],level:1,levelWins:0,placed:false,
 eggList:[],eggsGiven:0,makeLog:[],unitDone:{},checkins:{},zodiacTickets:0,poolTickets:0,poolOffer:null,log:{},dayOffset:0,sound:true,totalCorrect:0,totalWrong:0}}
let S;
try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.noEgg){(S.pets||[]).forEach(p=>p.growth=Math.max(0,p.growth-30));S.noEgg=true} // migrate old saves (egg stage removed)
const P=()=>S.pets[S.active]||S.pets[0];
function ws(unit,w){const k=unit.id+":"+w.w;return S.words[k]||(S.words[k]={box:0,due:0,ok:0,miss:0,known:false})}
function knownCount(unit){return unit.words.filter(w=>ws(unit,w).known).length}
function stageIdx(p){p=p||P();let i=0;STAGES.forEach((s,j)=>{if(p.growth>=s.need)i=j});return i}
const pad=n=>String(n).padStart(2,"0");
function nowD(){return new Date(Date.now()+(S.dayOffset||0)*864e5)}
function dk(off){const d=new Date(Date.now()+((S.dayOffset||0)+(off||0))*864e5);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayLog(){return S.log[dk()]||(S.log[dk()]={learned:0,correct:0,wrong:0})}
function logAdd(f,v,uniq){const t=todayLog();t[f]=t[f]||[];if(!uniq||!t[f].includes(v))t[f].push(v)}
function logLv(i,n){const t=todayLog();t.lv=t.lv||{};t.lv[i]=(t.lv[i]||0)+n}
const totalCk=()=>Object.keys(S.checkins).length;
const eggLeft=e=>Math.max(0,EGG_HATCH-(totalCk()-e.got));
function eggCheck(){ // cumulative check-in days (never reset): every 7 days -> 1 egg; egg hatches after 3 more check-in days
 const total=totalCk(),should=Math.floor(total/EGG_AT);let msg="";
 while(S.eggsGiven<should){S.eggsGiven++;S.eggList.push({got:total});msg="🥚 累计打卡 "+total+" 天！<br>获得一个神秘蛋，再打卡 "+EGG_HATCH+" 天就能孵化"}
 S.eggList.forEach(e=>{if(!e.told&&eggLeft(e)===0){e.told=true;msg="🐣 神秘蛋可以孵化啦！<br>去「宠物」看看吧"}});
 if(msg)setTimeout(()=>toast(msg,2200),1300)}
function weekKeys(off){const t=new Date(Date.now()+((S.dayOffset||0)+(off||0))*864e5),dow=(t.getDay()+6)%7;return Array.from({length:7},(_,i)=>dk((off||0)+i-dow))}
function makeupsLeft(){const wk=weekKeys();return Math.max(0,MAKEUP_WEEK-S.makeLog.filter(m=>wk.includes(m.at)).length)}
function streak(){let n=0,o=S.checkins[dk()]?0:-1;while(S.checkins[dk(o)]){n++;o--}return n}
const ownedSp=k=>S.pets.some(p=>p.sp===k);
function newPet(k,growth){S.pets.push({sp:k,name:SP[k].nm,growth:growth||0,equip:{},maxed:false});S.active=S.pets.length-1;logAdd("pets",k)}

const $=s=>document.querySelector(s);
const app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
function pic(w){return w.c?`<span class="swatch" style="background:${w.c}"></span>`:w.p}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hl(s,word){const re=new RegExp("\\b("+word.replace(/ /g,"\\s")+")\\b","i");return esc(s).replace(re,"<b>$1</b>")}
function blankS(w){return esc(w.s).replace(new RegExp("\\b"+w.w+"\\b","i"),'<span class="blank">&nbsp;?&nbsp;</span>')}
let voice=null;
function pickVoice(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Google|Natural|Aria|Jenny/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate){if(!S.sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||0.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let toastT;
function toast(t,ms){const el=$("#toast");el.innerHTML=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),ms||1100)}
function praise(){return pick(["Great job! 太棒了","Awesome! 真厉害","Yes! 答对啦","Super! 好棒","Well done! 干得好"],1)[0]}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(m);return m}
function back(fn){const b=$("#back");if(b)b.onclick=fn||home}
const BACK=`<button class="iconbtn" id="back" aria-label="返回">🏠</button>`;

function petHTML(p,big){
 p=p||P();const st=ART(stageIdx(p)),scale=big?(0.8+st*0.07):0.55,sz=st===0?170:190,pos=DECO(st);
 let deco="";for(const slot in p.equip){const it=ITEMS.find(i=>i.id===p.equip[slot]);if(!it)continue;const q=pos[slot];
  deco+=`<div class="deco" style="top:${q.top}px;font-size:${q.fs}px;${q.left?"left:"+q.left:""}">${it.e}</div>`}
 return `<div class="petWrap" id="pet" style="width:${sz}px;height:${sz}px;transform:scale(${scale});transform-origin:50% 100%"><div class="petIdle" style="position:relative;width:100%;height:100%">${petSVGAny(st,p.sp)}${deco}</div></div>`}
function mini(k,st,size){return petSVGAny(st,k).replace(/width="\d+" height="\d+"/,`width="${size}" height="${size}"`)}
function buddy(msg){return `<div class="row" style="justify-content:center;margin-top:10px"><div style="width:86px;height:86px;flex:none" class="petIdle">${mini(P().sp,ART(stageIdx()),86)}</div><div style="background:#fff;border-radius:18px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 #ecdcf5">${msg}</div></div>`}

function startPlace(){

  if(type==="order")c=c.filter(x=>x.w.s.split(" ").length<=5);if(type==="spell")c=c.filter(x=>!x.w.w.includes(" ")&&x.w.w.length<=5);
  const x=pick(c,1)[0];used.add(x.w.w);return {tier,type,w:x.w,pool:x.u.words,n:tier===1?3:4,once:true,noPic:tier===6,extra:tier===6?2:0}});
 PL={qs,i:0,res:{1:[],2:[],3:[],4:[],5:[],6:[]}};say("Let's go!",1);renderPlace();

function placeResult(){

// ---------- generic question renderer ----------
function qRender(el,q,cb){
 const w=q.w,n=q.n||4,t=q.type;let first=true,locked=false,markRight=()=>{};
 const miss=b=>{first=false;if(b){b.classList.add("bad");if(!q.once)setTimeout(()=>b.classList.add("done"),400)}
  if(q.once){locked=true;markRight();say(w.w);setTimeout(()=>cb.done(false),900);return true}
  const stop=cb.wrong&&cb.wrong();if(stop){locked=true;return true}say("Try again",1);return false};
 const win=()=>{locked=true;cb.done(first)};
 if(["hear","see","sent","fill"].includes(t)){
  const opts=shuffle([w,...pick(q.pool.filter(x=>x.w!==w.w),n-1)]);
  const txt=t==="see"||t==="fill";let head="";
  if(t==="hear")head=`<h2 class="center">👂 听一听，是哪个？</h2><button class="speak" data-say>🔊</button><p class="muted center">Tap 🔊 to listen</p>`;
  if(t==="see")head=`<h2 class="center">👀 这是什么？ What is it?</h2><div class="bigPic">${pic(w)}</div>`;
  if(t==="sent")head=`<h2 class="center">📖 读句子，选图片</h2><div class="sent">${blankS(w)}</div><button class="speak sm" data-say>🔊</button>`;
  if(t==="fill")head=`<h2 class="center">✏️ 填空 Fill in the blank</h2>${q.noPic?"":`<div class="bigPic mid">${pic(w)}</div>`}<div class="sent">${blankS(w)}</div>`;
  el.innerHTML=`<div class="card">${head}</div><div class="opts ${n===2?"":""}">${opts.map(o=>`<button class="opt ${txt?"txt":""}" data-w="${esc(o.w)}">${txt?esc(o.w):pic(o)}</button>`).join("")}</div>`;
  const sp=el.querySelector("[data-say]");if(sp)sp.onclick=()=>say(t==="sent"?w.s:w.w,t==="sent"?.8:.85);
  markRight=()=>{el.querySelectorAll(".opt").forEach(b=>{if(b.dataset.w===w.w)b.classList.add("ok")})};
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;
   if(b.dataset.w===w.w){b.classList.add("ok");const bl=el.querySelector(".blank");if(bl)bl.textContent=w.w;say(t==="fill"||t==="sent"?w.s:w.w,.85);win()}else miss(b)});
 }else if(t==="order"||t==="spell"){
  const target=t==="order"?w.s.replace(/[.!?]$/,"").split(" "):w.w.split("");
  const extra=t==="spell"&&q.extra?pick("abcdefghijklmnopqrstuvwxyz".split("").filter(c=>!target.includes(c)),q.extra):[];
  const tiles=shuffle([...target,...extra].map((x,i)=>({t:x,i})));let built=[];
  const draw=()=>{
   el.innerHTML=`<div class="card center"><h2>${t==="order"?"🧩 排句子 Make a sentence":"🔤 拼一拼 Spell it"}</h2>${q.noPic?"":`<div class="bigPic mid">${pic(w)}</div>`}<button class="speak sm" data-say>🔊</button>
   <div class="answer tiles">${built.map((x,k)=>`<button class="tile" data-k="${k}">${esc(x.t)}</button>`).join("")||`<span class="muted" style="align-self:center">${t==="order"?"点下面的单词排成句子":"点字母拼出单词"}</span>`}</div>
   <div class="tiles">${tiles.map((x,k)=>`<button class="tile ${built.includes(x)?"used":""}" data-t="${k}">${esc(x.t)}</button>`).join("")}</div></div>
   <button class="btn green full" data-chk ${built.length<target.length?"disabled":""}>✅ 检查 Check</button>`;
   el.querySelector("[data-say]").onclick=()=>say(t==="order"?w.s:w.w,.8);
   el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(locked)return;const x=tiles[+b.dataset.t];if(!built.includes(x)&&built.length<target.length){built.push(x);say(x.t,1);draw()}});
   el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(locked)return;built.splice(+b.dataset.k,1);draw()});
   el.querySelector("[data-chk]").onclick=()=>{if(locked)return;
    const ok=built.map(x=>x.t).join(" ").toLowerCase()===target.join(" ").toLowerCase();
    if(ok){say(t==="order"?w.s:w.w,.85);win()}else{built=[];first=false;if(q.once){locked=true;say(w.w);setTimeout(()=>cb.done(false),700);return}
     const stop=cb.wrong&&cb.wrong();if(stop){locked=true;return}toast(t==="order"?"顺序不对，再试试 🙂":"拼错啦，再试试 🙂",1000);draw()}};
  };draw();
 }else if(t==="match"){
  const words=shuffle(q.ws),pics=shuffle(q.ws);let sel=null,left=words.length;
  el.innerHTML=`<div class="card center"><h2>🔗 连连看 Match!</h2><p class="muted">先点单词，再点对应的图片</p></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="display:grid;gap:12px">${words.map(w=>`<button class="opt txt" style="font-size:22px" data-w="${esc(w.w)}">${esc(w.w)}</button>`).join("")}</div>
  <div style="display:grid;gap:12px">${pics.map(w=>`<button class="opt" style="min-height:80px;font-size:48px" data-p="${esc(w.w)}">${pic(w)}</button>`).join("")}</div></div>`;
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{if(locked)return;el.querySelectorAll("[data-w]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;say(b.dataset.w)});
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(locked)return;if(!sel){toast("先点一个单词 👈",900);return}
   if(b.dataset.p===sel.dataset.w){b.classList.add("ok","done");sel.classList.remove("sel");sel.classList.add("ok","done");sel=null;left--;if(!left)win()}
   else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);first=false;if(cb.wrong&&cb.wrong())locked=true}});
 }
}

 const nw=u.words.filter(w=>{const s=ws(u,w);return !s.known&&s.miss===0});
 let list=due.slice(0,3).concat(nw.slice(0,5-Math.min(3,due.length)));
 if(list.length<5)list=list.concat(u.words.filter(w=>!list.includes(w)).sort((a,b)=>ws(u,a).due-ws(u,b).due).slice(0,5-list.length));
 L={u,queue:list.map(w=>({w,phase:ws(u,w).known?"quiz":"card"})),total:list.length,done:0,earned:0,cur:null,right:0,wrong:0};
 screen="learn";scrollTo(0,0);nextStep();
}

let MU=null;
function startMakeup(day){
 if(makeupsLeft()<=0){toast(`本周补签次数用完啦<br>每周最多 ${MAKEUP_WEEK} 次`,1600);return}
 const known=UNITS.flatMap(u=>u.words.filter(w=>ws(u,w).known).map(w=>({u,w})));
 if(known.length<5){toast("先学会至少 5 个单词<br>才能用复习小测验补签哦",1800);return}
 let types=LV[S.level].types.filter(t=>t!=="spell");if(!types.length)types=["see","sent"];
 MU={day,qs:pick(known,5).map(x=>({type:pick(types,1)[0],w:x.w,pool:x.u.words,n:Math.max(3,LV[S.level].opts),once:true})),i:0,score:0};
 screen="makeup";scrollTo(0,0);say("Review time!",1);renderMakeup();
}
function renderMakeup(){
 const q=MU.qs[MU.i];
 app.innerHTML=`<div class="top">${BACK}<span class="chip">🩹 ${MU.i+1}/5</span><span class="chip">✅ ${MU.score}</span></div>

 qRender($("#q"),q,{done:c=>{if(c)MU.score++;toast(c?"✅ "+praise():"💪 没关系！",900);setTimeout(()=>{MU.i++;MU.i<MU.qs.length?renderMakeup():makeupResult()},1000)}});
}

let sumTab="today";
function periodDays(tab){if(tab==="today")return [dk()];if(tab==="week")return weekKeys();
 const t=nowD(),y=t.getFullYear(),m=t.getMonth(),n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>`${y}-${pad(m+1)}-${pad(i+1)}`)}
function periodStats(tab){
 const days=periodDays(tab),set=f=>{const s=new Set();days.forEach(d=>((S.log[d]||{})[f]||[]).forEach(v=>s.add(v)));return [...s]},list=f=>days.flatMap(d=>(S.log[d]||{})[f]||[]);
 const studied=[...new Set([...set("ok"),...set("bad")])];
 const need=studied.filter(k=>{const s=S.words[k];return s&&(!s.known||(s.miss>0&&s.box<2))});
 const rem=studied.filter(k=>!need.includes(k));
 const lv={};days.forEach(d=>{const o=(S.log[d]||{}).lv||{};for(const i in o)lv[i]=(lv[i]||0)+o[i]});
 const ck=days.filter(d=>S.checkins[d]);
 return {days,rem,need,units:set("units"),done:set("done"),ch:list("ch"),ckOk:ck.filter(d=>S.checkins[d]==="ok").length,ckMk:ck.filter(d=>S.checkins[d]==="mk").length,lv,items:set("items"),pets:list("pets"),correct:days.reduce((a,d)=>a+((S.log[d]||{}).correct||0),0)};
}

 <div class="row" style="gap:8px;margin:8px 0">${[["today","今天"],["week","本周"],["month","本月"]].map(([k,n])=>`<button class="btn ${sumTab===k?"":"gray"}" style="flex:1;font-size:17px" data-tab="${k}">${n}</button>`).join("")}</div>
 <div class="card"><h2>📅 ${lbl} <span class="muted" style="font-size:13px">${P_.days[0].slice(5)}${P_.days.length>1?" ~ "+P_.days[P_.days.length-1].slice(5):""}</span></h2>
  <div class="stats"><div class="stat"><b>${P_.rem.length}</b><small>⭐ 记住的单词</small></div><div class="stat"><b>${P_.need.length}</b><small>🔁 需要复习</small></div>

 app.innerHTML=`<div class="top">${BACK}<h1 style="margin:0">⚙️ 测试面板</h1><span style="width:52px"></span></div>
 <p class="muted center">家长 / 开发测试用 · 模拟日期：${dk()}（偏移 ${S.dayOffset} 天）<br>累计打卡 ${totalCk()} 天 · 神秘蛋 ${S.eggList.length} · 本周补签剩余 ${makeupsLeft()}/${MAKEUP_WEEK}</p>
 <div class="card"><h2>📅 打卡 / 日期</h2><div class="tgrid">${B("tCk","✅ 打卡今天 +1 天","green")}${B("tSkip","⏭️ 模拟漏打卡一天","gray")}${B("tCk7","📆 连续打卡 7 天","green")}${B("tPrev","⏪ 前一天","gray")}${B("tGoal","✅ 完成今日任务","green")}${B("tMkReset","🩹 重置本周补签","gray")}</div></div>
 <div class="card"><h2>🥚 蛋 / 宠物</h2><div class="tgrid">${B("tHatch","🐣 立即孵化神秘蛋","")}${B("tEgg","🥚 送 1 个新蛋","green")}${B("tMax","🌟 当前宠物直接满级","")}${B("tAllZ","🐲 集齐并满级 11 只生肖","")}${B("tE","+100 能量","orange")}${B("tG","+100 成长","orange")}${B("tItems","👗 送全部装扮","green")}</div></div>
 <div class="card"><h2>📚 学习</h2><div class="tgrid">${B("tKnow","记住 8 个/主题 (解锁挑战)","green")}${B("tMiss","制造 3 个错题","gray")}${B("tPlace","🎯 重新做星级测验","")}${B("tPick","🐾 重新选首个宠物","")}</div>
  <div style="margin-top:10px" class="row">${Array.from({length:MAXLV},(_,i)=>i+1).map(n=>`<button class="btn ${S.level===n?"":"gray"}" style="flex:1;padding:6px;font-size:14px" data-lv="${n}">${n}⭐</button>`).join("")}</div></div>
 <div class="card"><div class="tgrid">${B("tReset","🔄 清空全部进度","gray")}${B("tHome","🏠 回首页","")}</div><pre id="js"></pre></div>`;
 $("#js").textContent=JSON.stringify({today:dk(),level:S.level,energy:S.energy,totalCheckins:totalCk(),eggList:S.eggList.map(e=>({got:e.got,left:eggLeft(e)})),makeLog:S.makeLog,pets:S.pets.map(q=>q.sp+":"+q.growth+(q.maxed?"★":"")),zodiacTickets:S.zodiacTickets,poolTickets:S.poolTickets,checkins:S.checkins,todayLog:todayLog()},null,1);
 back(home);
 const R=msg=>{save();toast(msg,1000);testPanel()};
 const ckToday=()=>{if(!S.checkins[dk()]){S.checkins[dk()]="ok";eggCheck()}};
 $("#tCk").onclick=()=>{ckToday();S.dayOffset++;R("已打卡，前进到 "+dk())};
 $("#tSkip").onclick=()=>{S.dayOffset++;R("今天没打卡，前进到 "+dk())};
 $("#tCk7").onclick=()=>{for(let i=0;i<7;i++){ckToday();S.dayOffset++}R("累计打卡 "+totalCk()+" 天")};
 $("#tPrev").onclick=()=>{S.dayOffset--;R(dk())};
 $("#tGoal").onclick=()=>{const t=todayLog();t.correct=Math.max(t.correct,GOAL);R("今日任务完成")};
 $("#tMkReset").onclick=()=>{const wk=weekKeys();S.makeLog=S.makeLog.filter(m=>!wk.includes(m.at));R("本周补签已重置")};
 $("#tHatch").onclick=()=>{if(!S.eggList.length)S.eggList.push({got:totalCk()-EGG_HATCH,told:true});else{S.eggList[0].got=totalCk()-EGG_HATCH;S.eggList[0].told=true}save();eggHatch(0)};
 $("#tEgg").onclick=()=>{S.eggList.push({got:totalCk()});R("+1 🥚（再打卡 3 天孵化）")};
 $("#tE").onclick=()=>{S.energy+=100;R("+100⚡")};
 $("#tG").onclick=()=>{const b=stageIdx(p);p.growth+=100;save();afterGrowth(p,b)};
 $("#tMax").onclick=()=>{const b=stageIdx(p);p.growth=Math.max(p.growth,STAGES[MAXST].need);save();afterGrowth(p,b)};
 $("#tAllZ").onclick=()=>{ZORDER.forEach(k=>{if(!ownedSp(k))S.pets.push({sp:k,name:SP[k].nm,growth:STAGES[MAXST].need,equip:{},maxed:true})});S.pets.forEach(q=>{if(ZORDER.includes(q.sp)&&q!==p){q.growth=Math.max(q.growth,STAGES[MAXST].need);q.maxed=true}});S.zodiacTickets=0;R("其余生肖已集齐并满级，再点「当前宠物直接满级」")};
 $("#tItems").onclick=()=>{S.items=ITEMS.map(i=>i.id);R("全部装扮")};
 $("#tKnow").onclick=()=>{UNITS.forEach(u=>u.words.slice(0,UNLOCK_N).forEach(w=>{const s=ws(u,w);s.known=true;s.box=Math.max(1,s.box)}));R("已解锁全部大挑战")};
 $("#tMiss").onclick=()=>{UNITS.forEach(u=>{const w=u.words[UNLOCK_N];const s=ws(u,w);s.miss++;s.box=0;s.due=0;logAdd("bad",u.id+":"+w.w,true)});S.totalWrong+=3;R("已添加错题")};
 $("#tPlace").onclick=()=>{S.placed=false;save();placeIntro()};
 $("#tPick").onclick=()=>{if(confirm("清空宠物并重新选择？")){S.pets=[];S.active=0;save();zodiacPicker(false)}};
 app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.level=+b.dataset.lv;S.levelWins=0;R(S.level+"⭐")});
 $("#tReset").onclick=()=>{if(confirm("确定清空全部进度？")){localStorage.removeItem(KEY);S=fresh();save();home()}};
 $("#tHome").onclick=home;
}
render();

</script>
<script>
// launch splash (~1s), tap to skip
(function(){var sp=document.getElementById('spiSplash');if(!sp)return;var t0=Date.now();
 function hide(){if(document.documentElement.dataset.holdSplash)return;sp.classList.add('out');setTimeout(function(){sp.remove()},500)}
 sp.addEventListener('click',hide);setTimeout(hide,Math.max(0,1000-(Date.now()-t0)));})();
// service worker (offline support). Skipped for file:// previews.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(e){console.warn('SW register failed',e)})});
}
</script>
</body>
</html>

let L=null;
function gamesFor(w){const g=["hear","see","bub"];if(w.w.length<=9&&/^[a-z]+$/.test(w.w))g.push("spell");if(w.lv>=3)g.push("cloze","mean");if(w.lv>=4&&w.s.split(" ").length<=8)g.push("sb");if(w.lv>=5)g.push("read");return g}
function pickGame(w,avoid){const g=gamesFor(w).filter(x=>x!==avoid);return pick1(g)}
function dueReviews(n){const now=Date.now();return W.filter(w=>{const s=S.w[w.w];return s&&s.k&&s.d<=now}).sort((a,b)=>S.w[a.w].d-S.w[b.w].d).slice(0,n)}
function buildCluster(level,unit,size){
 const un=w=>!isKnown(w);let pool=LVW[level].filter(un);if(unit)pool=pool.filter(w=>w.u===unit.i).concat(pool.filter(w=>w.u!==unit.i));
 if(!pool.length)return [];
 const seed=unit?pick1(pool.filter(w=>w.u===unit.i).length?pool.filter(w=>w.u===unit.i):pool):pick1(pool);
 const out=[seed];const add=w=>{if(w&&un(w)&&!out.includes(w)&&w.lv<=level&&out.length<size)out.push(w)};
 // associations: word family / synonyms / opposites / co-occurring words, then same theme
 for(let k=0;k<out.length&&out.length<size;k++)out[k].rel.map(i=>W[i]).forEach(add);
 shuffle(pool.filter(w=>w.u===seed.u)).forEach(add);
 shuffle(pool).forEach(add);
 return out}
function startLearn(opt){opt=opt||{};newRound();

 let revs=opt.words?opt.words.slice(0,10):opt.mystery?[]:dueReviews(news.length?4:8);
 if(!news.length&&!revs.length){revs=pick(W.filter(isKnown),6);if(!revs.length){toast("这个星级的单词都学完啦！🎉<br>去参加考级吧",1800);return}}
 const steps=[];const qd=[];let gi=0;
 news.forEach((w,i)=>{steps.push({t:"card",w});if(i>0)steps.push({t:"q",w:news[i-1],g:pickGame(news[i-1])});if(i%3===2&&i>0){steps.push({t:"q",w:news[i],g:pickGame(news[i])});const grp=news.slice(i-2,i+1);steps.push({t:"q",g:"mem",w:grp[0],ws:grp});steps.push({t:"web",w:news[i-1]})}});
 if(news.length&&news.length%3!==0){const last=news[news.length-1];steps.push({t:"q",w:last,g:pickGame(last)});if(news.length>=2)steps.push({t:"web",w:last})}

  <div class="bigcode">${fmtCode(prof.code)}</div><div class="qrwrap">${qrSVG(FR_PREFIX+prof.code,170)}</div>
  <div class="row" style="justify-content:center"><button class="btn gray sm" id="rg">🔁 换一个代码</button><button class="btn gray sm" id="rn">✏️ 改昵称</button></div></div>
  ${inc.length?`<div class="card hl"><h2>📨 等你批准（${inc.length}）</h2>${inc.map(r=>`<div class="frow">${card(r.from)}<button class="btn green sm" data-ok="${r.id}">允许</button><button class="btn gray sm" data-no="${r.id}">拒绝</button><button class="btn gray sm" data-bk="${r.from.kid}" title="屏蔽">🚫</button></div>`).join("")}<p class="muted" style="font-size:12px;margin:6px 0 0">对方家长已经同意。你也允许后，两个孩子才会成为好友。</p></div>`:""}
  <div class="card"><h2>➕ 添加好友</h2><p class="muted" style="font-size:13px">输入对方家长发来的好友代码，或扫描对方的二维码。对方家长也同意后才会成为好友。</p>
   <div class="row"><input id="fc" class="codeIn" style="flex:1" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button class="btn" id="fsend">发送</button></div>
   <button class="btn blue full" id="fscan" style="margin-top:8px">📷 扫二维码</button><div id="cam"></div><p id="fmsg" class="muted" style="min-height:20px;margin:6px 0 0"></p>
   ${out.length?`<h3 style="margin:8px 0 4px">⏳ 等待对方家长批准</h3>${out.map(r=>`<div class="frow">${card(r.to)}<button class="btn gray sm" data-cx="${r.id}">撤回</button></div>`).join("")}`:""}</div>
  <div class="card"><h2>🧑‍🤝‍🧑 好友（${fl.length}）</h2>${fl.length?fl.map(f=>`<div class="frow">${card(f)}<button class="btn gray sm" data-rm="${f.kid}">移除</button><button class="btn gray sm" data-bk="${f.kid}" title="屏蔽">🚫</button></div>`).join(""):`<p class="muted">还没有好友。</p>`}
  ${blk.length?`<h3 style="margin:10px 0 4px">🚫 已屏蔽</h3>${blk.map(b=>`<div class="frow">${card(b.kid)}<button class="btn gray sm" data-ub="${b.kid.kid}">解除</button></div>`).join("")}`:""}
  <p class="muted" style="font-size:12px;margin:8px 0 0">孩子之间只能串门、点赞、送贴纸和送装饰，没有聊天，不会显示真实姓名。</p></div>`;
 bindChips();const T=st.token,again=()=>friendsPanel();
 $("#rg").onclick=async()=>{if(!confirm("换新代码后，旧代码立即失效（已经是好友的不受影响）。"))return;try{await rpc("regen_friend_code",{p_token:T,p_child:k.cid});again()}catch(e){toast(frErr(e),1400)}};
 $("#rn").onclick=()=>{const m=modal(`<h2>✏️ 改昵称</h2><div class="nickbig" id="nk2">${esc(nickTxt(prof.nick))}</div><div class="row"><select id="na2" class="sel">${NICK_A.map((t,i)=>`<option value="${i}" ${i===prof.nick[0]?"selected":""}>${t}</option>`).join("")}</select><select id="nb2" class="sel">${NICK_B.map((t,i)=>`<option value="${i}" ${i===prof.nick[1]?"selected":""}>${t}</option>`).join("")}</select></div><div class="row" style="margin-top:10px"><button class="btn gray" id="c2" style="flex:1">取消</button><button class="btn" id="o2" style="flex:1">保存</button></div>`);
  const u=()=>m.querySelector("#nk2").textContent=nickTxt([+m.querySelector("#na2").value,+m.querySelector("#nb2").value]);m.querySelector("#na2").onchange=u;m.querySelector("#nb2").onchange=u;m.querySelector("#c2").onclick=()=>m.remove();
  m.querySelector("#o2").onclick=async()=>{const n=[+m.querySelector("#na2").value,+m.querySelector("#nb2").value];try{const r=await rpc("kid_profile_setup",{p_token:T,p_child:k.cid,p_nick_a:n[0],p_nick_b:n[1]});const d=getKid(k.cid);d.fr={kid:r.kid,nick:r.nick};d.upd=Date.now();setKid(k.cid,d);if(k.cid===S.cid)save();else markDirty(k.cid);m.remove();again()}catch(e){toast(frErr(e),1400)}}};
 const send=async code=>{const c=(code||$("#fc").value).toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==8){$("#fmsg").textContent="好友代码是 8 位哦";return}$("#fsend").disabled=true;
  try{const r=await rpc("friend_request",{p_token:T,p_child:k.cid,p_code:c});
   $("#fmsg").innerHTML=r.status==="not_found"?"❌ "+frErr("not_found"):r.status==="friends"?`🎉 已成为好友：<b>${esc(nickTxt(r.friend.nick))}</b>`:r.status==="already_friends"?"已经是好友啦":"✅ 已发送，等对方家长批准";
   if(r.status!=="not_found")setTimeout(again,900)}catch(e){$("#fmsg").textContent="❌ "+frErr(e)}finally{const b=$("#fsend");b&&(b.disabled=false)}};
 $("#fsend").onclick=()=>send();$("#fc").onkeydown=e=>{if(e.key==="Enter")send()};$("#fscan").onclick=()=>scanFriendQR(send);
 const act=(sel,fn)=>app.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{b.disabled=true;try{await fn(b)}catch(e){toast(frErr(e),1400)}again()});
 act("[data-ok]",b=>rpc("answer_friend_request",{p_token:T,p_request:b.dataset.ok,p_ok:true}).then(()=>toast("🎉 已成为好友",1000)));
 act("[data-no]",b=>rpc("answer_friend_request",{p_token:T,p_request:b.dataset.no,p_ok:false}));
 act("[data-cx]",b=>rpc("cancel_friend_request",{p_token:T,p_request:b.dataset.cx}));
 act("[data-ub]",b=>rpc("unblock_kid",{p_token:T,p_child:k.cid,p_kid:b.dataset.ub}));
 app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("移除这个好友？之后需要重新加。"))return;try{await rpc("remove_friend",{p_token:T,p_child:k.cid,p_kid:b.dataset.rm})}catch(e){toast(frErr(e),1400)}again()});
 app.querySelectorAll("[data-bk]").forEach(b=>b.onclick=async()=>{if(!confirm("屏蔽后对方不能再加这个孩子为好友，也不能来串门。"))return;try{await rpc("block_kid",{p_token:T,p_child:k.cid,p_kid:b.dataset.bk})}catch(e){toast(frErr(e),1400)}again()})}
async function scanFriendQR(cb){const cam=$("#cam");if(!("BarcodeDetector" in window)||!navigator.mediaDevices){toast("这个浏览器不支持扫码，请输入代码",1600);return}
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});cam.innerHTML=`<video id="vid" playsinline autoplay muted style="width:100%;border-radius:14px;margin-top:8px"></video>`;const v=$("#vid");v.srcObject=stream;const det=new BarcodeDetector({formats:["qr_code"]});
  const stop=()=>stream.getTracks().forEach(t=>t.stop());const loop=async()=>{if(!document.body.contains(v))return stop();try{const c=await det.detect(v);const hit=c.find(x=>x.rawValue&&x.rawValue.startsWith(FR_PREFIX));if(hit){stop();cam.innerHTML="";const code=hit.rawValue.slice(FR_PREFIX.length);$("#fc").value=fmtCode(code);return cb(code)}}catch(e){}requestAnimationFrame(loop)};loop()}
 catch(e){toast("无法打开相机，请输入代码",1500)}}
setTimeout(frBadge,300);

document.body.insertAdjacentHTML("afterbegin",itemDefs());
render();
